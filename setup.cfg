[metadata]
name = autocure
version = 1.3.0
author = Vishal More
author_email = vishalbhagwanmore12@gmail.com
description = Automated data health diagnosis, smart cleaning, AutoML, and MLflow model versioning engine.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
keywords = data-cleaning, data-science, automl, machine-learning, scikit-learn, explainability, fastapi, mlflow, model-registry
url = https://github.com/Vishal2053/Autocure
project_urls =
    Homepage = https://github.com/Vishal2053/Autocure
    Source = https://github.com/Vishal2053/Autocure
    Tracker = https://github.com/Vishal2053/Autocure/issues
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas
    numpy
    scikit-learn
    click
    mlflow

[options.extras_require]
api =
    fastapi
    uvicorn
nlp =
    nltk
all =
    fastapi
    uvicorn
    nltk

[options.entry_points]
console_scripts =
    autocure = autocure.cli.main:cli

